        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <style>
        .ol-overlay-container { z-index: 1100; }
        .ol-popup { position: static; max-width: 340px; }
        #popup-content { font-size: 15px; line-height: 1.35; max-height: 62vh; overflow-y: auto; }
        #popup-content .pp-ko { font-size: 17px; font-weight: bold; }
        #popup-content .pp-en { font-size: 14.5px; color: #444; margin-bottom: 4px; }
        #popup-content .pp-cert { display: inline-block; font-size: 12.5px; padding: 1px 8px; border-radius: 10px; margin: 2px 0 6px; }
        #popup-content .pp-cert.confirmed { background: #fde2e4; color: #801119; }
        #popup-content .pp-cert.uncertain { background: #e8e8e8; color: #333; border: 1px dashed #555; }
        #popup-content ul.desc { list-style-type: disc; padding-left: 1.2em; margin: 4px 0; }
        #popup-content ul.desc li { margin-bottom: 0.3em; }
        #popup-content .pp-ref { font-size: 13.5px; color: #555; margin-top: 4px; }
        #popup-content img.pp-img { display: block; width: 100%; max-height: 34vh; object-fit: contain; background: #111; border-radius: 6px; margin: 6px 0 2px; }
        #popup-content .pp-cap { font-size: 12px; color: #666; margin-bottom: 4px; }
        #map-title { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
            background: rgba(255,255,255,0.9); border-radius: 8px; padding: 6px 16px; text-align: center;
            box-shadow: 0 1px 6px rgba(0,0,0,0.35); font-family: 'Noto Sans CJK KR','Noto Sans',sans-serif; color: #172033; pointer-events: none; max-width: 70vw; }
        #map-title .t-ko { font-size: 18px; font-weight: bold; }
        #map-title .t-en { font-size: 13px; color: #444; }
        #legend { position: absolute; left: 8px; bottom: 36px; z-index: 1000; background: rgba(255,255,255,0.92);
            border-radius: 8px; padding: 8px 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.35); font-family: sans-serif;
            font-size: 13px; line-height: 1.5; color: #172033; max-width: 60vw; }
        #legend .li { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
        #legend .sw-c { width: 12px; height: 12px; background: #db1e2a; border: 2px solid #801119; transform: rotate(45deg); flex: none; margin: 0 2px; }
        #legend .sw-u { width: 14px; height: 14px; border-radius: 50%; background: #ebebeb; border: 2.5px dashed #3c3c3c; flex: none; box-sizing: border-box; }
        #legend .sw-r1 { width: 24px; border-top: 4px solid #db1e2a; flex: none; }
        #legend .sw-r2 { width: 24px; border-top: 4px dashed #28468c; flex: none; }
        #legend .sw-v { width: 14px; height: 14px; background: rgba(120,180,120,0.35); border: 1.5px solid rgba(70,130,70,0.7); flex: none; box-sizing: border-box; }
        @media (max-width: 650px) { #legend { font-size: 12px; bottom: 44px; } #map-title .t-ko { font-size: 15px; } #map-title .t-en { font-size: 11px; } #popup-content { max-width: 85vw; } }
        </style>
        <title>이스르엘이라 하라 2 · 예후의 행보 / Call Him Jezreel 2 · Jehu's Way</title>
    </head>
    <body>
        <div id="map">
            <div id="map-title"><div class="t-ko">이스르엘이라 하라 2 · 예후의 행보</div><div class="t-en">Call Him Jezreel 2 · Jehu's Way</div></div>
            <div id="legend">
                <div class="li"><span class="sw-c"></span><span>확인된 장소 / Confirmed site</span></div>
                <div class="li"><span class="sw-u"></span><span>비정 / Proposed site</span></div>
                <div class="li"><span class="sw-r1"></span><span>예후 진군 경로 / Jehu's advance</span></div>
                <div class="li"><span class="sw-r2"></span><span>아하시야 도주 경로 / Ahaziah's flight</span></div>
                <div class="li"><span class="sw-v"></span><span>이스르엘 평야 평지 / Jezreel Valley flat land</span></div>
            </div>

            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/_sitesJehuSites_0.js"></script><script src="layers/Jehusadvance_1.js"></script><script src="layers/Ahaziahsflight_2.js"></script><script src="layers/Jezreelflatland_3.js"></script>
        <script src="styles/_sitesJehuSites_0_style.js"></script><script src="styles/Jehusadvance_1_style.js"></script><script src="styles/Ahaziahsflight_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script>
        /* Custom popup layout (bilingual, bulleted descriptions, image) */
        function ppBullets(t) {
            if (!t) return '';
            var parts = String(t).split(/(?<=[.。])\s+|;\s+/).filter(Boolean);
            return '<ul class="desc">' + parts.map(function (p) { return '<li>' + p.replace(/[.。]$/, '') + '</li>'; }).join('') + '</ul>';
        }
        function createPopupField(f, keys, layer) {
            var g = function (k) { var v = f.get(k); return v == null ? '' : String(v); };
            var out = '<tr><td colspan="2">';
            out += '<div class="pp-ko">' + g('name_ko') + '</div><div class="pp-en">' + g('name_en') + '</div>';
            if (g('status')) {
                out += '<span class="pp-cert ' + g('status') + '">' + g('certainty') + '</span>';
            }
            if (g('waypoints_ko')) {
                out += '<div class="pp-en">' + g('waypoints_ko') + ' / ' + g('waypoints_en') + '</div>';
            }
            if (g('image')) {
                out += '<img class="pp-img" src="images/' + g('image') + '" alt="' + g('name_ko') + '" />' +
                       '<div class="pp-cap">AI 상상도 / AI illustration</div>';
            }
            out += ppBullets(g('desc_ko')) + ppBullets(g('desc_en'));
            out += '<div class="pp-ref">' + g('ref_ko') + ' / ' + g('ref_en') + '</div>';
            return out + '</td></tr>';
        }
        document.addEventListener('load', function (e) {
            if (e.target && e.target.tagName === 'IMG' && e.target.closest && e.target.closest('#popup-content') &&
                typeof overlayPopup !== 'undefined' && overlayPopup.getPosition()) {
                var p = overlayPopup.getPosition();
                overlayPopup.setPosition([p[0], p[1]]);
            }
        }, true);
        </script>
    </body>
</html>
